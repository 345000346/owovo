name: Github Pages
on:
  push:
    branches:
      - main

env:
  HUGO_VERSION: "0.157.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Hugo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-${{ hashFiles('package-lock.json', '.gitmodules', 'config/_default/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Verify Biome targets exist
        shell: bash
        run: |
          shopt -s globstar nullglob
          targets=(
            themes/meme/assets/js/**/*.js
            themes/meme/assets/css/**/*.css
            assets/js/**/*.js
            assets/css/**/*.css
          )
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No files matched Biome includes; fail to avoid false green CI."
            exit 1
          fi
          echo "Biome target files found: ${#targets[@]}"

      - name: Build
        run: npm run build

      - name: Verify Pagefind artifacts
        run: test -f public/pagefind/pagefind.js && test -f public/pagefind/pagefind-entry.json

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: 345000346/345000346.github.io
          cname: owovo.xyz
          publish_branch: master
          publish_dir: ./public
          commit_message: ${{ github.event.head_commit.message }}
