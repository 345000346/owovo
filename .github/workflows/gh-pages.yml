name: Github Pages
on:
  push:
    branches:
      - main
  # 允许在 GitHub Actions 页面手动触发发布。
  workflow_dispatch:

env:
  HUGO_VERSION: "0.158.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # 新提交到同一分支时，取消旧任务以节省构建时间。
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # 当前仓库未使用 Hugo Modules，无需缓存 Go 模块目录。
      - name: Setup Hugo cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hugo
          key: ${{ runner.os }}-hugo-${{ hashFiles('package-lock.json', '.gitmodules', 'config/_default/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Pagefind artifacts
        run: test -f public/pagefind/pagefind.js && test -f public/pagefind/pagefind-entry.json

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: 345000346/345000346.github.io
          cname: owovo.xyz
          publish_branch: master
          publish_dir: ./public
          commit_message: "${{ github.event.head_commit.message || format('deploy: publish {0}', github.sha) }}"
