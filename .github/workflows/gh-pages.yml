name: GitHub Pages

on:
  push:
    branches:
      - main
  # 允许在 GitHub Actions 页面手动触发发布。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # 新提交到同一分支时，取消旧任务以节省构建时间。
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.158.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 让预览地址和正式地址共用同一套构建命令，避免资源路径写死。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # 当前仓库未使用 Hugo Modules，无需缓存 Go 模块目录。
      - name: Setup Hugo cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hugo
          key: ${{ runner.os }}-hugo-${{ hashFiles('package-lock.json', '.gitmodules', 'config/_default/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      # 预览环境需要临时覆盖 baseURL，正式域名绑定后会自动切回对应地址。
      - name: Build site
        run: npm run build:site -- --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search
        run: npm run build:search

      - name: Verify Pagefind artifacts
        run: test -f public/pagefind/pagefind.js && test -f public/pagefind/pagefind-entry.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
