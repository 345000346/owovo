{{/* 文章归档：普通页，不生成 section 列表；只展示文章实体。 */}}
{{ define "main" }}
    <main class="main list" id="main">
        <div class="main-inner">
            <div class="content list-group">
                <h1 class="list-title">{{ (partial "utils/title.html" (dict "$" . "title" .Title)).htmlTitle }}</h1>
                {{ with .Content }}
                    <div class="section-content">{{ . }}</div>
                {{ end }}
                {{ partial "utils/year-grouped-list.html" (dict "pages" (partial "utils/post-pages.html" .)) }}
            </div>
        </div>
    </main>
{{ end }}
