{{/* 404：只 define main，共用 baseof（有搜索；无 SEO / hl loader）。 */}}
{{ define "main" }}
    <main class="fof" id="main">
        <div class="main-inner">
            <h1>404 - 页面不存在</h1>
            <div class="fof-footer">
                <a href="{{ "" | relLangURL }}">送我回主页</a>
            </div>
            {{- $recent := where .Site.RegularPages "Section" "eq" "post" | first 5 -}}
            {{- if $recent -}}
                <section class="fof-recent" aria-label="最近文章">
                    <h2>最近文章</h2>
                    {{ partial "utils/list-item.html" (dict "pages" $recent) }}
                </section>
            {{- end -}}
        </div>
    </main>
{{ end }}
