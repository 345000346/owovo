{{/* 顶栏：品牌 + 菜单 + 移动导航开关/幕布。 */}}
<header class="header">
    <div class="header-wrapper">
        <div class="header-inner {{ cond (or .IsHome (eq (len .Pages) 0)) "single" "list"}}">
            <div class="site-brand">
                <a href="{{ "" | relLangURL }}" class="brand">{{ .Site.Title }}</a>
            </div>
            {{ partial "menu.html" . }}
        </div>
    </div>
    {{ partial "components/nav-toggle.html" . }}
</header>
