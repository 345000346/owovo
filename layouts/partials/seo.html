<script type="application/ld+json">
    {
        "@context" : "http://schema.org",
        "@type" : "BlogPosting",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{ .Site.BaseURL }}"
        },
        "articleSection" : "{{ .Section }}",
        "name" : "{{ .Title }}",
        "headline" : "{{ .Title }}",
    {{ if .IsHome -}}
    "description" : "{{ .Site.Params.description }}",
    {{- else -}}
    "description" : "{{ default .Summary .Description }}",
    {{- end }}
    "inLanguage" : "zh-CN",
    {{ $authorName := default .Site.Title .Site.Params.author.name }}
    "author" : "{{ $authorName }}",
    "creator" : "{{ $authorName }}",
    "publisher": "{{ $authorName }}",
    "accountablePerson" : "{{ $authorName }}",
    "copyrightHolder" : "{{ $authorName }}",
    "copyrightYear" : "{{ .Date.Format "2006" }}",
    "datePublished": "{{ .Date }}",
    "dateModified" : "{{ .Date }}",
    "url" : "{{ .Permalink }}",
    "keywords" : [ {{ if isset .Params "tags" }}{{ range .Params.tags }}"{{ . }}",{{ end }}{{ end }} ]
    }
</script>
