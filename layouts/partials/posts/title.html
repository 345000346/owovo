<div>
    <h1 class="font-bold break-normal pt-2 pb-2 text-2xl lg:text-3xl" style="color: var(--text-color);">
        <a href="{{ .Permalink }}" title="{{ .Title }}">{{ .Title }}</a>
    </h1>
    <p class="mb-1 text-sm text-secondary">
        <!-- prettier-ignore -->
        <span title="{{ .Date.Format " 2006-01-02 15:04:05 MST" }}">
            <i class="iconfont icon-calendar" aria-hidden="true"></i>  {{ .Date.Year }}年{{ printf "%d" .Date.Month }}月{{ .Date.Day }}日
        </span>

        <span class="hidden xl:inline-block">
            |
            <i class="iconfont icon-book"></i>
            {{  .WordCount }} 字
        </span>

        <span class="hidden xl:inline-block">
            |
            <i class="iconfont icon-clock-o"></i>
            {{  .ReadingTime }} 分钟读完
        </span>
    </p>
</div>
