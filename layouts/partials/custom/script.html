{{ if .Site.Params.vercount }}
  {{ if .Site.Params.features.defer_stats }}
<script>
  (function () {
    function loadStats() {
      var script = document.createElement("script");
      script.src = "https://cn.vercount.one/js";
      script.defer = true;
      document.head.appendChild(script);
    }

    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(loadStats, { timeout: 3000 });
    } else {
      window.addEventListener("load", loadStats, { once: true });
    }
  })();
</script>
  {{ else }}
<script defer src="https://cn.vercount.one/js"></script>
  {{ end }}
{{ end }}

{{ if .Site.Params.runtime }}
<script>
  (function () {
    var start = new Date("{{ .Site.Params.runtime }}");
    if (Number.isNaN(start.getTime())) {
      return;
    }

    function updateRuntime() {
      var now = new Date();
      var diff = now - start;

      var days = Math.floor(diff / 1000 / 60 / 60 / 24);
      var hours = Math.floor((diff / 1000 / 60 / 60) % 24)
        .toString()
        .padStart(2, "0");
      var minutes = Math.floor((diff / 1000 / 60) % 60)
        .toString()
        .padStart(2, "0");
      var seconds = Math.floor((diff / 1000) % 60)
        .toString()
        .padStart(2, "0");

      var dayEl = document.getElementById("runtime-d");
      var hourEl = document.getElementById("runtime-h");
      var minuteEl = document.getElementById("runtime-m");
      var secondEl = document.getElementById("runtime-s");

      if (!dayEl || !hourEl || !minuteEl || !secondEl) {
        return;
      }

      dayEl.textContent = String(days);
      hourEl.textContent = hours;
      minuteEl.textContent = minutes;
      secondEl.textContent = seconds;
    }

    updateRuntime();
    setInterval(updateRuntime, 1000);
  })();
</script>
{{ end }}
