<!-- https://developer.twitter.com/en/docs/tweets/optimize-with-cards/guides/getting-started -->
{{- $ := index . "$" -}}
{{- $seo := .seo -}}

{{- with $seo.images -}}
    <meta name="twitter:card" content="summary_large_image" />
{{ else -}}
    <meta name="twitter:card" content="summary" />
{{- end }}
