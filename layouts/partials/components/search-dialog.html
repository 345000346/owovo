{{- $pagefindBundle := "pagefind/" | relURL -}}
{{- $pagefindJS := "pagefind/pagefind-ui.js" | relURL -}}
{{- $pagefindCSS := "pagefind/pagefind-ui.css" | relURL -}}
<dialog class="search-dialog" id="search-dialog" aria-labelledby="search-dialog-title">
    <div class="search-dialog-shell">
        <header class="search-dialog-header">
            <h2 id="search-dialog-title">搜索文章</h2>
            <button class="search-dialog-close" type="button" aria-label="关闭搜索面板">&times;</button>
        </header>
        <div class="search-dialog-search" id="search-dialog-search"></div>
        <footer class="search-dialog-footer">
            <span><kbd>/</kbd> 或 <kbd>Ctrl</kbd><kbd>K</kbd> 打开</span>
            <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
            <span><kbd>Enter</kbd> 打开</span>
            <span><kbd>Esc</kbd> 关闭</span>
        </footer>
    </div>
</dialog>
<template
    id="search-dialog-config"
    data-pagefind-bundle="{{ $pagefindBundle }}"
    data-pagefind-js="{{ $pagefindJS }}"
    data-pagefind-css="{{ $pagefindCSS }}"
></template>
