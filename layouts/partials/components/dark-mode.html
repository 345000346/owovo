{{/* 主题切换按钮；图标由 data-theme-preference CSS 显隐，文字与 aria-label 由 theme.js 更新。 */}}
<button id="theme-switcher" type="button" aria-label="切换主题，当前：跟随系统">
    {{- partial "utils/icon.html" (dict "$" $ "name" "sun" "class" "theme-icon-light") -}}
    {{- partial "utils/icon.html" (dict "$" $ "name" "moon" "class" "theme-icon-dark") -}}
    {{- partial "utils/icon.html" (dict "$" $ "name" "desktop" "class" "theme-icon-system") -}}
    <span class="theme-switcher-label">跟随系统</span>
</button>
