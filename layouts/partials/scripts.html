{{ $scripts := resources.Get "js/main.js" }} {{ if hugo.IsServer }}
<script src="{{ $scripts.RelPermalink }}"></script>
{{ else }} {{ $scripts := $scripts | minify | fingerprint }}
<script
  src="{{ $scripts.RelPermalink }}"
  integrity="{{ $scripts.Data.Integrity }}"
></script>
{{ end }}
<script
  src="/js/instantpage.min.js"
  type="module"
></script>
