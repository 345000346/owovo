{{/* Markdown 表格：外包 .table-container 便于横向滚动。 */}}
<div class="table-container">
    <table>
        <thead>
            {{- range .THead }}
                <tr>
                    {{- range . }}
                        <th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
                    {{- end }}
                </tr>
            {{- end }}
        </thead>
        <tbody>
            {{- range .TBody }}
                <tr>
                    {{- range . }}
                        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
                    {{- end }}
                </tr>
            {{- end }}
        </tbody>
    </table>
</div>
