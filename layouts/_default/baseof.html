<!doctype html>
<html lang="{{ $.Site.LanguageCode }}" class="{{ $.Site.Params.htmlClass }}">
  {{ partial "head.html" . }}

  <body class="bg-main text-main leading-normal tracking-wider">
    {{ partial "header.html" . }}

    <div
      id="container"
      class="container mx-auto mt-10 flex w-full flex-wrap px-2 text-main lg:pt-12"
    >
      {{- block "main" . }}{{- end }}
    </div>

    {{ partial "footer.html" . }} {{ partial "scripts.html" . }}
  </body>
</html>
