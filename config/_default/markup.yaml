# Goldmark 配置
goldmark:
  renderer:
    # 允许在 Markdown 中使用原始 HTML
    unsafe: true

# 目录（TOC）配置
# 显式声明，避免依赖 Hugo 默认值导致行为漂移
tableOfContents:
  startLevel: 2
  endLevel: 6
  ordered: true

# Hugo Chroma 代码高亮配置
highlight:
  codeFences: true
  guessSyntax: false
  lineNos: true
  lineNumbersInTable: true
  noClasses: true