# Goldmark 配置
goldmark:
  renderer:
    # 禁止 Markdown 中未经审查的原始 HTML
    unsafe: false

# 目录（TOC）配置
# 显式声明，避免依赖 Hugo 默认值导致行为漂移
tableOfContents:
  startLevel: 2
  endLevel: 6
  ordered: true

# Hugo Chroma 代码高亮配置
# noClasses: false — 用 CSS 类 + 主题 token，明暗切换可换色（勿回退 monokai 内联）
highlight:
  noClasses: false
  lineNos: true
  lineNumbersInTable: true
