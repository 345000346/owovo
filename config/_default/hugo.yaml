baseURL: "https://owovo.xyz"

locale: "zh-CN"

menu:
  main:
    - name: "首页"
      pageRef: "/"
      weight: 1
      pre: "internal"
      post: "home"
    - name: "文章"
      pageRef: "/archives/"
      weight: 2
      pre: "internal"
      post: "archive"
    - name: "标签"
      pageRef: "/tags/"
      weight: 3
      pre: "internal"
      post: "tag"
    - name: "想法"
      url: "/ideas/"
      weight: 4
      pre: "internal"
      post: "edit"
    - name: "关于"
      pageRef: "/about/"
      weight: 5
      pre: "internal"
      post: "user-circle"
    - name: "RSS"
      url: "/rss.xml"
      weight: 6
      pre: "internal"
      post: "rss"
    - identifier: "theme-switcher"
      weight: 7
    - name: "搜索"
      pageRef: "/search/"
      weight: 8
      pre: "internal"
      post: "search"

title: "LIGT'S BLOG"

copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh)"

theme: "meme"

# 保留 URL 原始大小写（某些文章 slug 含大写字母）
disablePathToLower: true

# 启用 CJK 支持（自动统计中文字数）
hasCJKLanguage: true

summaryLength: 260

permalinks:
  post: "/post/:slug/"

# 自定义 SectionsAtom 输出格式需要显式注册此 media type
mediaTypes:
  application/atom+xml:
    suffixes: ["xml"]

outputFormats:
  SectionsAtom:
    mediaType: "application/atom+xml"
    baseName: "atom"
  SectionsRSS:
    mediaType: "application/rss+xml"
    baseName: "rss"

outputs:
  home: ["HTML", "SectionsAtom", "SectionsRSS"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

services:
  rss:
    limit: 20

build:
  use: "postcss"

timeZone: "Asia/Shanghai"

timeout: "120s"

enableRobotsTXT: true

enableEmoji: true

# 资源缓存
caches:
  getresource:
    dir: ":cacheDir/:project"
    maxAge: "12h"
  images:
    dir: ":cacheDir/:project"
    maxAge: "24h"

security:
  exec:
    allow:
      - "^postcss$"
      - "^node$"
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
