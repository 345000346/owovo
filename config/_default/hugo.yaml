# 生产域名；勿改成 *.github.io（由 CNAME 绑定自定义域名）。
baseURL: "https://owovo.xyz"

defaultContentLanguage: "zh-cn"
locale: "zh-CN"

menu:
  main:
    - name: "首页"
      pageRef: "/"
      weight: 1
      post: "home"
    - name: "文章"
      pageRef: "/archives/"
      weight: 2
      post: "archive"
    - name: "标签"
      pageRef: "/tags/"
      weight: 3
      post: "tag"
    - name: "想法"
      pageRef: "/ideas/"
      weight: 4
      post: "edit"
    - name: "关于"
      pageRef: "/about/"
      weight: 5
      post: "user-circle"
    - name: "RSS"
      url: "/rss.xml"
      identifier: "rss"
      weight: 6
      post: "rss"
    - identifier: "theme-switcher"
      weight: 9
    # identifier=search + url=#search → 菜单触发搜索 Dialog（非独立 /search/ 页）
    - name: "搜索"
      url: "#search"
      identifier: "search"
      weight: 8
      post: "search"

title: "LIGT'S BLOG"

copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh)"

# 启用 CJK 支持（自动统计中文字数）
hasCJKLanguage: true

summaryLength: 260

# 首页分页：显式声明，避免依赖 Hugo 默认值导致行为漂移
paginate: 10

permalinks:
  post: "/post/:slug/"

# 仅 tags；禁止 categories taxonomy
taxonomies:
  tag: tags

disableKinds: ["section"]

outputs:
  home: ["HTML", "RSS"]
  taxonomy: ["HTML"]
  term: ["HTML"]

services:
  rss:
    limit: 20

# 首页 RSS 输出为 /rss.xml（非 index.xml）
outputFormats:
  RSS:
    baseName: "rss"

timeZone: "Asia/Shanghai"

timeout: "30s"

enableRobotsTXT: true

security:
  exec:
    allow:
      - "^node$"
      - "^sass$"
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
