# 网站的根 URL，建议取消注释并设置为您的域名
baseURL: "https://owovo.xyz"

# 网站默认语言
defaultContentLanguage: "zh-CN"

languages:
  zh-CN:
    locale: "zh-CN"
    label: "Chinese"
    weight: 1

menu:
  main:
    - name: "首页"
      pageRef: "/"
      weight: 1
      pre: "internal"
      post: "home"
    - name: "文章"
      pageRef: "/archives/"
      weight: 2
      pre: "internal"
      post: "archive"
    - name: "标签"
      pageRef: "/tags/"
      weight: 3
      pre: "internal"
      post: "tag"
    - name: "想法"
      url: "/ideas/"
      weight: 4
      pre: "internal"
      post: "edit"
    - name: "关于"
      pageRef: "/about/"
      weight: 5
      pre: "internal"
      post: "user-circle"
    - name: "RSS"
      url: "/rss.xml"
      weight: 6
      pre: "internal"
      post: "rss"
    - identifier: "theme-switcher"
      weight: 7
    - name: "搜索"
      pageRef: "/search/"
      weight: 8
      pre: "internal"
      post: "search"

# 网站标题
title: "LIGT'S BLOG"

copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh)"

author:
  name: "LIGT"
  avatar: "/images/avatar.webp"

# 使用的主题
theme: meme

# 禁止将 URL 转换为小写，保留原始大小写
disablePathToLower: true

# 启用 CJK（中日韩）语言支持，自动统计字数
hasCJKLanguage: true

# 自动摘要的长度（字符数）
summaryLength: 140

# 自定义文章的永久链接格式
permalinks:
  post: "/post/:slug/"

# 输出格式定义
mediaTypes:
  application/atom+xml:
    suffixes: ["xml"]

outputFormats:
  SectionsAtom:
    mediaType: "application/atom+xml"
    baseName: "atom"
  SectionsRSS:
    mediaType: "application/rss+xml"
    baseName: "rss"
  SearchIndex:
    mediaType: "application/json"
    baseName: "search"

# 首页输出使用主题示例的 SectionsAtom/SectionsRSS 组合（并保留搜索索引）
outputs:
  home: ["HTML", "SectionsAtom", "SectionsRSS", "SearchIndex"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

# 服务配置
services:
  rss:
    limit: 20 # RSS 输出的文章数量

build:
  writeStats: true
  use: postcss

# 时区配置
timeZone: "Asia/Shanghai"

# 构建超时时间
timeout: "120s"

# 启用 robots.txt 生成
enableRobotsTXT: true

# 缓存配置
caches:
  getresource:
    dir: ":cacheDir/:project"
    maxAge: "12h"
  images:
    dir: ":cacheDir/:project"
    maxAge: "24h"

security:
  exec:
    allow:
      - "^(dart-)?sass(-embedded)?$"
      - "^git$"
      - "^npx$"
      - "^postcss$"
      - "^tailwindcss$"
      - "^go$"
      - "^node$"
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
