baseURL: "https://owovo.xyz"

defaultContentLanguage: "zh-cn"
locale: "zh-CN"

menu:
  main:
    - name: "首页"
      pageRef: "/"
      weight: 1
      post: "home"
    - name: "文章"
      pageRef: "/archives/"
      weight: 2
      post: "archive"
    - name: "标签"
      pageRef: "/tags/"
      weight: 3
      post: "tag"
    - name: "想法"
      pageRef: "/ideas/"
      weight: 4
      post: "edit"
    - name: "关于"
      pageRef: "/about/"
      weight: 5
      post: "user-circle"
    - name: "RSS"
      url: "/rss.xml"
      weight: 6
      post: "rss"
    - identifier: "theme-switcher"
      weight: 7
    - name: "搜索"
      pageRef: "/search/"
      weight: 8
      post: "search"

title: "LIGT'S BLOG"

copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh)"

# 启用 CJK 支持（自动统计中文字数）
hasCJKLanguage: true

summaryLength: 260

permalinks:
  post: "/post/:slug/"

outputs:
  home: ["HTML", "RSS"]
  section: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

outputFormats:
  RSS:
    baseName: "rss"

timeZone: "Asia/Shanghai"

timeout: "30s"

enableRobotsTXT: true

security:
  exec:
    allow:
      - "^node$"
      - "^sass$"
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
