# 网站的根 URL，建议取消注释并设置为您的域名
baseURL: "https://owovo.xyz" # 请替换为您的域名

# 网站默认语言
languageCode: "zh-CN"
defaultContentLanguage: "zh-CN" # 已从 'cn' 修正为 'zh-CN'

languages:
  zh-CN:
    languageName: "Chinese"
    weight: 1

# 网站标题
title: "LIGT'S BLOG"

# 使用的主题
# 注意：在后续步骤中，我们建议使用 Hugo Modules 来管理主题，届时此项会更新
module:
  imports:
    - path: themes/echo-modern

# 禁止将 URL 转换为小写，保留原始大小写
disablePathToLower: true

# 启用 CJK（中日韩）语言支持，自动统计字数
hasCJKLanguage: true

# 自动摘要的长度（字符数）
summaryLength: 140

# 自定义文章的永久链接格式
permalinks:
  post: "/post/:slug/"

# 输出格式定义
outputFormats:
  RSS:
    mediaType: "application/rss+xml" # 使用了更标准的 mediatype
    baseName: "rss"

# 服务配置
services:
  rss:
    limit: 5 # RSS 输出的文章数量

build:
  writeStats: true
  use: postcss

security:
  exec:
    allow:
      - "^npx$"
      - "^postcss$"
      - "^go$"