# 网站的根 URL，建议取消注释并设置为您的域名
baseURL: "https://owovo.xyz"

# 网站默认语言
languageCode: "zh-CN"
defaultContentLanguage: "zh-CN"

languages:
  zh-CN:
    languageName: "Chinese"
    weight: 1

# 网站标题
title: "LIGT'S BLOG"

author:
  name: "LIGT"
  avatar: "/images/avatar.webp"

social:
  github: "345000346"
  weibo: "1733321624"

# 使用的主题
theme: echo

# 禁止将 URL 转换为小写，保留原始大小写
disablePathToLower: true

# 启用 CJK（中日韩）语言支持，自动统计字数
hasCJKLanguage: true

# 自动摘要的长度（字符数）
summaryLength: 140

# 自定义文章的永久链接格式
permalinks:
  post: "/post/:slug/"

# 输出格式定义
outputFormats:
  RSS:
    mediaType: "application/rss+xml" # 使用了更标准的 mediatype
    baseName: "rss"

# 确保首页输出包含RSS
outputs:
  home: ["HTML", "RSS"]
  section: ["HTML", "RSS"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]

# 服务配置
services:
  rss:
    limit: 20 # RSS 输出的文章数量

build:
  writeStats: true
  use: postcss

# 时区配置
timeZone: "Asia/Shanghai"

# 构建超时时间
timeout: "120s"

# 启用 robots.txt 生成
enableRobotsTXT: true

# 缓存配置
caches:
  getresource:
    dir: ":cacheDir/:project"
    maxAge: "12h"
  getjson:
    dir: ":cacheDir/:project"
    maxAge: "12h"
  images:
    dir: ":cacheDir/:project"
    maxAge: "24h"

security:
  exec:
    allow:
      - "^npx$"
      - "^postcss$"
      - "^go$"
      - "^node$"