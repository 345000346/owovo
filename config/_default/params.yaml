# 作者信息
author:
  avatar: "/images/avatar.webp"
  name: "LIGT"

# 浏览器地址栏与系统 UI 的主题色
themeColor: "#edeee7"
themeColorDark: "#131612"

# 用于 head meta、RSS 提要
siteDescription: "分享一些日常、没事无聊的瞎想、一些常用的工具等"

# 用于 JSON-LD / OG 默认图
siteLogo: "/images/avatar.webp"

# 用于页脚年份显示
siteCreatedTime: "2019-08-22T00:00:00+08:00"

# 列表与文章元信息日期格式
listDateFormat: "1 月 2 日"
# 文章元信息与首页行条目左栏共用：首页左栏宽度由本页最长的日期自动决定，
# 改成「1 月 2 日」这类长短不一的格式也不会错位。
postMetaDateFormat: "2006-01-02"

# 暗色模式：无用户选择时跟随系统（localStorage key: theme = light|dark|system）

# 本地字体由 scripts/sync-fonts.mjs 按 .fonts-manifest.json 增量同步到 static/fonts（--force 强制重拷）。
