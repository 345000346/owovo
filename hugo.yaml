baseURL: "https://owovo.xyz"
languageCode: "zh-CN"
title: "LIGT'S BLOG"
theme: "echo"
DefaultContentLanguage: "cn"
disablePathToLower: true
uglyurls: true
hasCJKLanguage: true
summaryLength: 140

permalinks:
  posts: "/:filename"

params:
  author:
    avatar: "/images/avatar.webp"
    name: "LIGT"
  social:
    github: "345000346"
    weibo: "1733321624"
    rss: "/rss.xml"
  mainSections:
    - post
  favicon: "/favicon.ico"
  subtitle: "分享一些日常、没事无聊的瞎想、一些常用的工具等"
  keywords: "日常,想法,Android,Windows,手机,电脑"
  description: "分享一些日常、没事无聊的瞎想、一些常用的工具等"
  vercount: true
  googleAnalytics: "G-ND67DP0RT5"
  runtime: "2019-08-22T00:00:00+08:00"
  rssFullContent: true
  staticCDNPrefix: "https://cdn.bootcss.com/font-awesome/5.11.2"
  navItems:
    - ["首页", "/"]
    - ["文章", "/post.html"]
    - ["想法", "/ideas.html"]
    - ["关于", "/about.html"]
    - ["RSS", "/rss.xml"]

outputFormats:
  RSS:
    mediatype: "application/rss"
    baseName: "rss"

services:
  rss:
    limit: 5

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    noClasses: true
    style: "manni"
    tabWidth: 2