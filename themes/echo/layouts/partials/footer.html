<!-- Pin to top right corner -->
<footer class="bg-white border-t border-gray-400 shadow mt-10">
    <div class="container mx-auto flex py-8">
        <div class="w-full text-center text-gray-600">
            <!-- 站点运行时间 -->
            {{ if .Site.Params.runtime }} 本站已稳定运行
            <b id="d"></b> 天 <b id="h"></b> 小时 <b id="m"></b> 分 <b id="s"></b> 秒
            <script>
                function timer() {
                    var start = new Date({{ .Site.Params.runtime }});
                var t = new Date() - start;
                var h = ~~(t / 1000 / 60 / 60 % 24);
                if (h < 10) {
                    h = "0" + h;
                }
                var m = ~~(t / 1000 / 60 % 60);
                if (m < 10) {
                    m = "0" + m;
                }
                var s = ~~(t / 1000 % 60);
                if (s < 10) {
                    s = "0" + s;
                }
                document.getElementById('d').innerHTML = ~~(t / 1000 / 60 / 60 / 24);
                document.getElementById('h').innerHTML = h;
                document.getElementById('m').innerHTML = m;
                document.getElementById('s').innerHTML = s;
                }
                timer();
                setInterval(timer, 1000);
            </script>
            {{- end }}
            <p>
                &copy; {{ now.Format "2006" }}
                <a class="text-gray-700" href="{{ .Site.BaseURL | absURL }}"
                    >{{ .Site.Title }} By {{ .Site.Author.name }} .</a
                >
                Powered by
                <a rel="nofollow noreferer noopener" href="https://gohugo.io/" class="text-gray-700" target="_blank"
                    >Hugo.</a
                >
                Theme based on
                <a href="https://github.com/forecho/hugo-theme-echo" class="text-gray-700" target="_blank">Echo.</a>
            </p>

            {{ if .Site.Params.busuanzi -}}
            <span id="busuanzi_container">
                访客数：<span id="busuanzi_value_site_uv"></span> | 访问量 <span id="busuanzi_value_site_pv"></span>
            </span>
            {{- end }}
        </div>
    </div>
</footer>

{{ template "_internal/google_analytics.html" . }}
