<!-- 页脚 -->
<footer class="border-t shadow mt-10 footer-border footer-container">
    <div class="container mx-auto flex flex-col md:flex-row items-center justify-between py-8 text-secondary">
        <!-- 左侧区域: 版权和技术栈 -->
        <div class="w-full md:w-1/3 text-center md:text-left mb-4 md:mb-0">
            <p>&copy; {{ now.Format "2006" }} <a href="{{ .Site.BaseURL | absURL }}" class="footer-link">{{ .Site.Title }}</a></p>
            <p>Powered by <a href="https://gohugo.io/" class="footer-link" target="_blank">Hugo</a> & <a href="https://github.com/forecho/hugo-theme-echo" class="footer-link" target="_blank">Echo</a></p>
        </div>

        <!-- 中间区域: 网站统计 -->
        <div class="w-full md:w-1/3 text-center mb-4 md:mb-0">
            {{ if .Site.Params.vercount }}
            <div id="vercount-container">
                <span id="vercount_value_site_pv">Loading</span> Visitors | <span id="vercount_value_site_uv">Loading</span> Views
            </div>
            {{ end }}
        </div>

        <!-- 右侧区域: 网站运行时间 -->
        <div class="w-full md:w-1/3 text-center md:text-right">
            {{/* 检查是否在 hugo.yaml 中配置了 runtime 参数 */}}
            {{ if .Site.Params.runtime }}
            <p>Running for <b id="d"></b>d <b id="h"></b>h <b id="m"></b>m <b id="s"></b>s</p>
            <script>
                // 动态计算网站已运行时间的脚本
                function timer() {
                    // 从 hugo.yaml 的 .Site.Params.runtime 获取建站时间
                    var start = new Date("{{ .Site.Params.runtime }}");
                    var t = new Date() - start;
                    
                    // 计算天、时、分、秒
                    var h = ~~(t / 1000 / 60 / 60 % 24);
                    if (h < 10) { h = "0" + h; }
                    var m = ~~(t / 1000 / 60 % 60);
                    if (m < 10) { m = "0" + m; }
                    var s = ~~(t / 1000 % 60);
                    if (s < 10) { s = "0" + s; }

                    // 将计算结果更新到 HTML 元素中
                    document.getElementById('d').innerHTML = ~~(t / 1000 / 60 / 60 / 24);
                    document.getElementById('h').innerHTML = h;
                    document.getElementById('m').innerHTML = m;
                    document.getElementById('s').innerHTML = s;
                }
                // 页面加载时立即执行一次
                timer();
                // 每秒钟更新一次
                setInterval(timer, 1000);
            </script>
            {{- end }}
        </div>
    </div>
</footer>
