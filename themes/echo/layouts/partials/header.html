<nav id="header" class="fixed w-full z-40 top-0 shadow nav-container">

  <!-- 页面滚动进度条 -->
  <div id="progress" class="h-1 z-20 top-0 progress-bar"></div>

  <div class="w-full container mx-auto flex flex-wrap items-center justify-between my-1">
      <!-- 网站标题 -->
      <div class="pl-4">
          <a class="text-base no-underline hover:no-underline font-bold text-xl nav-text" href="/">
              {{ $.Site.Title }}
          </a>
      </div>

      <!-- 移动端导航按钮 -->
      <div class="block lg:hidden pr-4">
          <button id="nav-toggle" class="flex items-center px-3 py-2 border rounded appearance-none focus:outline-none nav-toggle-button">
              <svg class="fill-current h-3 w-3" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><title>Menu</title><path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"/></svg>
          </button>
      </div>

      <!-- 桌面端导航 -->
      <div class="hidden w-full lg:flex lg:items-center lg:w-auto" id="nav-content-desktop">
        <ul class="list-reset lg:flex justify-end flex-1 items-center">
              {{- range $item := $.Site.Params.NavItems }}
              <li class="mr-3">
                  <a href="{{ index $item 1 }}" class="inline-block py-2 px-4 font-bold no-underline nav-text">{{ index $item 0 }}</a>
              </li>
              {{- end }}
              <li class="mr-3">
                <button id="theme-toggle" class="inline-block py-2 px-2 font-bold no-underline nav-text bg-transparent border-none cursor-pointer">
                    <svg id="theme-toggle-dark-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
              </li>
          </ul>
      </div>
  </div>
</nav>

<!-- 全屏移动端导航 -->
<div id="nav-content-mobile" class="hidden fixed inset-0 bg-main z-50">
    <button id="nav-close" class="absolute top-0 right-0 mt-4 mr-4">
        <svg class="h-6 w-6 nav-text" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 6L18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    <div class="nav-links">
        <ul class="list-reset text-center">
            {{- range $item := $.Site.Params.NavItems }}
            <li class="my-4">
                <a href="{{ index $item 1 }}" class="text-2xl font-bold nav-text">{{ index $item 0 }}</a>
            </li>
            {{- end }}
        </ul>
    </div>
    <div class="theme-toggle-container">
      <button id="theme-toggle-mobile" class="inline-block py-2 px-2 font-bold no-underline nav-text bg-transparent border-none cursor-pointer">
        <svg id="theme-toggle-dark-icon-mobile" class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        <svg id="theme-toggle-light-icon-mobile" class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
      </button>
    </div>
</div>
