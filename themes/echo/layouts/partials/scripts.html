<script src="https://unpkg.com/swup@4"></script>
<script data-swup-reload-script>
  // --- 1. DEFINE ALL HELPERS ---

  // Nav helpers
  const closeNav = () => {
    const navContent = document.getElementById('nav-content');
    const overlay = document.getElementById('overlay');
    if (navContent) navContent.classList.remove('is-open');
    if (overlay) overlay.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
  };

  const openNav = () => {
    const navContent = document.getElementById('nav-content');
    const overlay = document.getElementById('overlay');
    if (navContent) navContent.classList.add('is-open');
    if (overlay) overlay.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  };

  // Theme helper
  const handleThemeToggle = () => {
    const htmlElement = document.documentElement;
    const currentTheme = htmlElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    htmlElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  };

  // Scroll helper
  const handleScroll = () => {
    const progressBar = document.querySelector('#progress');
    const navContent = document.getElementById('nav-content');
    const scrollY = window.scrollY;
    const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    
    if (progressBar) {
      progressBar.style.setProperty('--scroll', `${(scrollY / scrollHeight) * 100}%`);
    }
    
    if (navContent) {
      if (scrollY <= 10) {
        navContent.classList.add('bg-main');
      } else {
        navContent.classList.remove('bg-main');
      }
    }
  };

  // Content-specific helper
  const handleExternalLinks = () => {
    const hostname = window.location.hostname;
    document.querySelectorAll('a[href^="http"]').forEach(link => {
      if (new URL(link.href).hostname !== hostname) {
        link.target = '_blank';
      }
    });
  };

  // --- 2. ADD PERSISTENT LISTENERS ONCE ---
  document.addEventListener('DOMContentLoaded', () => {
    // Nav click listener
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('#nav-toggle')) {
        openNav();
      } else if (e.target.closest('#nav-close') || e.target.id === 'overlay') {
        closeNav();
      }
      // Theme toggle is also handled here since it's a click on the body
      if (e.target.closest('#theme-toggle')) {
          handleThemeToggle();
      }
    });

    // System color scheme listener
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    mediaQuery.addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        const newTheme = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
      }
    });

    // Scroll listener
    document.addEventListener('scroll', handleScroll);
  });

  // --- 3. INITIALIZE SWUP ---
  const swup = new Swup();

  // --- 4. RUN CONTENT-SPECIFIC CODE ON LOAD & PAGE VIEW ---
  const runPageScripts = () => {
    handleExternalLinks();
  };

  // Initial load
  runPageScripts();
  // After Swup navigation
  swup.hooks.on('page:view', runPageScripts);

  // --- 5. SWUP NAV HOOK ---
  swup.hooks.on('visit:start', closeNav);

</script>
