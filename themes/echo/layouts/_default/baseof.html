<!DOCTYPE html>
<html lang="{{ $.Site.LanguageCode }}">

{{ partial "head.html" . }}
<script>
  // 在页面加载时立即应用主题
  const htmlElement = document.documentElement;
  const savedTheme = localStorage.getItem('theme') || 'light';
  htmlElement.setAttribute('data-theme', savedTheme);
</script>

<body class="text-gray-900 tracking-wider leading-normal" style="background-color: var(--bg-color);">

    {{ partial "header.html" . }}

    <div id="container" class="container w-full flex flex-wrap mx-auto px-2 pt-16 lg:pt-20" style="color: var(--text-color);">

    {{- block "main" . }}{{- end }}

    </div>
    
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
</body>

</html>
