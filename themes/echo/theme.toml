# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Echo"
license = "MIT"
licenselink = "https://github.com/forecho/hugo-theme-echo/blob/master/LICENSE"
description = "一个简洁优雅的 Hugo 博客主题，支持深色模式，针对中文排版优化"
homepage = "https://github.com/forecho/hugo-theme-echo"
tags = [
    "responsive",
    "blog",
    "simple",
    "clean",
    "tailwindcss",
    "syntax highlighting",
    "dark mode",
    "chinese",
    "minimal",
    "fast"
]
features = [
    "responsive",
    "blog",
    "simple",
    "clean",
    "tailwindcss",
    "syntax highlighting",
    "dark mode",
    "SEO optimized",
    "mobile friendly",
    "chinese typography"
]
min_version = "0.80.0"

[author]
  name = "forecho"
  homepage = "https://blog.forecho.com"
  github = "https://github.com/forecho"