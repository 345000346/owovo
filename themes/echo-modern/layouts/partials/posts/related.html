{{/* 获取与当前页面相关的前5篇文章 */}}
{{ $related := (where site.RegularPages "Type" "in" (slice "post" "posts")).Related . | first 5 }}
{{ with $related }}

<div
  class="mt-6 rounded p-8 shadow lg:mt-0"
  style="background-color: var(--card-bg-color)"
>
    <h2 class="text-main break-normal px-2 pb-3 font-sans text-xl font-bold">
    {{ i18n "related_posts" }}
  </h2>
    {{/* 遍历并显示相关文章列表 */}}
  {{ range . }}
  <li>
    <a href="{{ .RelPermalink }}" class="text-accent underline">{{ .Title }}</a>
  </li>
  {{ end }}
</div>
{{ end }}
