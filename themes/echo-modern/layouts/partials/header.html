<nav id="header" class="nav-container fixed top-0 z-40 w-full bg-card shadow">
  <!-- 页面滚动进度条 -->
  <div id="progress" class="progress-bar top-0 z-20 h-1"></div>

  <div
    class="container mx-auto my-1 flex w-full flex-wrap items-center justify-between"
  >
    <!-- 网站标题 -->
    <div class="pl-4">
      <a
        class="nav-text text-base text-xl font-bold no-underline hover:no-underline"
        href="/"
      >
        {{ $.Site.Title }}
      </a>
    </div>

    <!-- 移动端导航按钮 -->
    <div class="block pr-4 lg:hidden">
      <button
        id="nav-toggle"
        class="nav-toggle-button flex appearance-none items-center rounded border px-3 py-2 focus:outline-none"
      >
        <svg
          class="h-3 w-3 fill-current"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <title>Menu</title>
          <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
        </svg>
      </button>
    </div>

    <!-- 桌面端导航 -->
    <div
      class="hidden w-full lg:flex lg:w-auto lg:items-center"
      id="nav-content-desktop"
    >
      <ul class="list-reset flex-1 items-center justify-end lg:flex">
        {{- range .Site.Menus.main }}
        <li class="mr-3">
          <a
            href="{{ .URL }}"
            class="nav-text inline-block px-4 py-2 font-bold no-underline"
            >{{ .Name }}</a
          >
        </li>
        {{- end }}
        <li class="mr-3">
          <button
            id="theme-toggle"
            class="nav-text inline-block cursor-pointer border-none bg-transparent px-2 py-2 font-bold no-underline"
          >
            <svg
              id="theme-toggle-dark-icon"
              class="h-5 w-5"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
              ></path>
            </svg>
            <svg
              id="theme-toggle-light-icon"
              class="h-5 w-5"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                fill-rule="evenodd"
                clip-rule="evenodd"
              ></path>
            </svg>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 全屏移动端导航 -->
<div id="nav-content-mobile" class="bg-main fixed inset-0 z-50 hidden">
  <button id="nav-close" class="absolute right-0 top-0 mr-4 mt-4">
    <svg
      class="nav-text h-6 w-6"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M18 6L6 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M6 6L18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <div class="nav-links">
    <ul class="list-reset text-center">
      {{- range .Site.Menus.main }}
      <li class="my-4">
        <a href="{{ .URL }}" class="nav-text text-2xl font-bold"
          >{{ .Name }}</a
        >
      </li>
      {{- end }}
    </ul>
  </div>
  <div class="theme-toggle-container">
    <button
      id="theme-toggle-mobile"
      class="nav-text inline-block cursor-pointer border-none bg-transparent px-2 py-2 font-bold no-underline"
    >
      <svg
        id="theme-toggle-dark-icon-mobile"
        class="h-8 w-8"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
        ></path>
      </svg>
      <svg
        id="theme-toggle-light-icon-mobile"
        class="h-8 w-8"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
          fill-rule="evenodd"
          clip-rule="evenodd"
        ></path>
      </svg>
    </button>
  </div>
</div>
