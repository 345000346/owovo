<aside class="text-main w-full px-6 leading-normal">

  <div class="sticky top-20 flex flex-col justify-between pb-4">
    {{ if or .Params.toc (and .Site.Params.toc (ne .Params.toc false)) }}

    {{ end }}

    <div class="bg-card mt-5 rounded p-4 shadow">
      {{ partial "posts/jinrishici.html" . }}
    </div>
  </div>
</aside>
