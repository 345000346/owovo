{{- $href := .Destination -}}
{{- $isRemote := or (strings.HasPrefix $href "http://") (strings.HasPrefix $href "https://") -}}
<a href="{{ $href | safeURL }}"
{{- with .Title }} title="{{ . }}"{{ end -}}
{{- if and .Page.Site.Params.hrefTargetBlank $isRemote }} target="_blank" rel="noopener"{{ end -}}
{{- range $key, $value := .Attributes -}}
    {{- if and (ne $key "href") (ne $key "title") (ne $key "target") (ne $key "rel") -}}
        {{- printf " %s=%q" $key $value | safeHTMLAttr -}}
    {{- end -}}
{{- end -}}
>{{ .Text | safeHTML }}</a>
