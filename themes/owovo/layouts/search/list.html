{{ define "main" }}
    <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}" />

    <style>
        .search-area {
            margin-top: 0.5rem;
        }

        .pagefind-ui {
            --pagefind-ui-primary: var(--color-primary);
            --pagefind-ui-text: var(--color-contrast-high);
            --pagefind-ui-background: var(--color-bg);
            --pagefind-ui-border: var(--color-contrast-low);
            --pagefind-ui-border-width: 1px;
            --pagefind-ui-border-radius: 0.75rem;
            --pagefind-ui-font: inherit;
        }

        .pagefind-ui__search-input {
            font-family: inherit;
        }

        .pagefind-ui__result-link {
            color: var(--color-contrast-high);
        }

        .pagefind-ui__message,
        .pagefind-ui__result-excerpt {
            color: var(--color-contrast-medium);
        }

        .pagefind-ui mark {
            background: none;
            color: var(--color-primary);
            font-weight: 700;
        }
    </style>

    <main class="main list" id="main">
        <div class="main-inner">
            <div class="content list-group" data-pagefind-ignore>
                <h1 class="list-title">{{ .Title }}</h1>
                <div id="search" class="search-area"></div>
            </div>
        </div>
    </main>

    <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
    <script>
        (() => {
            const highlightParam = "hl";
            let currentTerm = "";

            function getHashSearch() {
                return new URLSearchParams(window.location.hash.slice(1)).get("search") || "";
            }

            function withHighlight(rawUrl) {
                if (!currentTerm || !rawUrl) return rawUrl;

                try {
                    const url = new URL(rawUrl, window.location.origin);
                    url.searchParams.delete(highlightParam);
                    url.searchParams.append(highlightParam, currentTerm);
                    return rawUrl.startsWith("http")
                        ? url.toString()
                        : `${url.pathname}${url.search}${url.hash}`;
                } catch {
                    return rawUrl;
                }
            }

            function processResult(result) {
                const next = {
                    ...result,
                    url: withHighlight(result.url),
                    meta: { ...result.meta },
                };

                if (next.meta.url) {
                    next.meta.url = withHighlight(next.meta.url);
                }

                if (Array.isArray(result.sub_results)) {
                    next.sub_results = result.sub_results.map((subResult) => ({
                        ...subResult,
                        url: withHighlight(subResult.url),
                    }));
                }

                return next;
            }

            const search = new PagefindUI({
                element: "#search",
                bundlePath: "{{ "pagefind/" | relURL }}",
                excerptLength: 25,
                focusOnSlash: true,
                highlightParam,
                pageSize: 5,
                processResult,
                processTerm(term) {
                    currentTerm = term.trim();
                    return currentTerm;
                },
                showImages: false,
                showSubResults: true,
                sort: { term_frequency_desc: {} },
            });

            const initialTerm = getHashSearch();
            if (initialTerm) {
                requestAnimationFrame(() => search.triggerSearch(initialTerm));
            }

            window.addEventListener("hashchange", () => {
                search.triggerSearch(getHashSearch());
            });
        })();
    </script>

    <noscript>
        <p style="padding: 2rem 0; color: var(--color-contrast-medium); text-align: center">
            {{ i18n "pagefindSearchNoScript" }}
        </p>
    </noscript>
{{ end }}
