<!-- http://ogp.me/ -->
{{- $ := index . "$" -}}
{{- $seo := .seo -}}

<meta property="og:title" content="{{ $seo.title }}" />
<meta property="og:description" content="{{ $seo.description }}" />
<meta property="og:url" content="{{ $.Permalink }}" />
<meta property="og:site_name" content="{{ $.Site.Title }}" />
<meta property="og:locale" content="{{ $.Site.Language.Lang }}" />

{{- range $seo.images -}}
    <meta property="og:image" content="{{ . }}" />
{{- end -}}

{{- if and $.IsPage (in $.Site.Params.mainSections $.Section) -}}
    <meta property="og:type" content="article" />
    <meta property="article:published_time" content="{{ $seo.dates.pubDate }}" />
    <meta property="article:modified_time" content="{{ $seo.dates.modDate }}" />
    {{ if not $.ExpiryDate.IsZero -}}
        <meta property="article:expiration_time" content="{{ $.ExpiryDate.Format "2006-01-02T15:04:05-07:00" }}" />
    {{- end }}
    <meta property="article:section" content="{{ $.Section }}" />
{{ else -}}
    <meta property="og:type" content="website" />
{{- end }}
